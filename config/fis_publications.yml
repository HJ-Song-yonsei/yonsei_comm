# Classification for the website feed:
# - Any article title containing Hangul is treated as domestic.
# - Otherwise, a Hangul journal title is treated as domestic.
# - English-titled Korean journals should be listed here.
# - All articles are still retained in fis_publications_all.json regardless of classification.
# Add exact FIS journal titles as they appear in data/fis_publications_review.json.
domestic_journal_overrides:
  - "Asian Communication Research"

# Optional explicit exclusions. These are not required for correctness because
# unclassified English titles already go to review rather than the domestic feed.
# Add entries if you want the review file to stay compact.
foreign_journal_overrides:
  - "Journal of Communication"
  - "Communication Research"
  - "Human Communication Research"
  - "New Media & Society"
  - "Communication Theory"
  - "Communication Methods and Measures"
  - "Communication Monographs"
  - "Political Communication"
  - "Journalism"
  - "Journalism & Mass Communication Quarterly"
  - "Mass Communication and Society"
  - "International Journal of Advertising"
  - "Public Relations Review"
