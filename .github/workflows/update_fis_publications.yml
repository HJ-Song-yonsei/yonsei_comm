name: Update FIS domestic publications

on:
  workflow_dispatch:
  schedule:
    # Every Monday 07:15 KST (Sunday 22:15 UTC)
    - cron: "15 22 * * 0"

permissions:
  contents: write

concurrency:
  group: update-fis-publications
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 certifi PyYAML

      - name: Build FIS domestic-publication JSON
        run: python scripts/build_fis_domestic_publications.py

      - name: Commit updated data
        shell: bash
        run: |
          git add data/fis_domestic_publications.json data/fis_publications_review.json

          if git diff --cached --quiet; then
            echo "No publication changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update FIS domestic publications"
          git push
