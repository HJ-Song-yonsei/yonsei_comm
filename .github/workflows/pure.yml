name: Update Pure Publications JSON

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 14 * *"   # 06:00 KST on the 15th of every month
  push:
    branches: [ main ]
    paths:
      - "scripts/build_pure_publications_json.py"

permissions:
  contents: write

concurrency:
  group: research-data-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install certifi PyYAML

      - name: Create data directory
        run: mkdir -p data

      - name: Build Pure and refresh research-area feeds
        run: |
          python scripts/build_pure_publications_json.py
          # Pure is the primary publication source for the research-area pages.
          # Rebuild all area feeds whenever the Pure publication feed changes.
          python scripts/build_jds_people_json.py
          python scripts/build_digital_people_json.py
          python scripts/build_crisis_people_json.py
          python scripts/build_health_people_json.py

      - name: Commit if changed
        shell: bash
        run: |
          git add data/*.json

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Pure and research-area feeds"
          git pull --rebase origin main
          git push origin HEAD:main
