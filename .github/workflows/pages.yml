name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install i18n build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-i18n.txt

      - name: Validate DeepL secret
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          if [ -z "$DEEPL_API_KEY" ]; then
            echo "::error::DEEPL_API_KEY repository secret is not configured. See i18n/DEEPL_SETUP.md."
            exit 1
          fi

      - name: Restore DeepL translation cache
        uses: actions/cache@v4
        with:
          path: .i18n-cache
          key: deepl-en-${{ github.sha }}
          restore-keys: |
            deepl-en-

      - name: Assemble static site to build/
        run: |
          mkdir -p build
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.i18n-cache' \
            --exclude '.i18n-source' \
            --exclude 'build' \
            ./ build/
          touch build/.nojekyll

      - name: Prepare Korean site and EN toggle
        run: python scripts/prepare_korean_site.py

      - name: Prepare protected English translation source
        run: python scripts/prepare_translation_source.py

      - name: Build core English static site with DeepL
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          python scripts/build_english_site.py \
            --source .i18n-source \
            --output build/en \
            --cache .i18n-cache/en.json

      - name: Build additional English pages
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          python scripts/build_additional_english_pages.py \
            --source .i18n-source \
            --output build/en \
            --cache .i18n-cache/en.json

      - name: Apply English terminology and navigation overrides
        run: python scripts/postprocess_english_site.py

      - name: Refine English homepage and navigation
        run: python scripts/refine_english_site.py

      - name: Verify production bilingual build
        run: python scripts/verify_i18n_build.py

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
