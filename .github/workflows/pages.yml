name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install English-site build dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 deepl

      - name: Restore DeepL translation cache
        uses: actions/cache@v4
        with:
          path: .i18n-cache
          key: deepl-en-${{ github.sha }}
          restore-keys: |
            deepl-en-

      - name: Assemble static site to build/
        run: |
          mkdir -p build
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.i18n-cache' \
            --exclude 'build' \
            ./ build/
          touch build/.nojekyll

      - name: Build English static site with DeepL
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          python scripts/build_english_site.py \
            --source . \
            --output build/en \
            --cache .i18n-cache/en.json

      - name: Apply English layout-fit and terminology overrides
        run: python scripts/postprocess_english_site.py

      - name: Refine English homepage and navigation
        run: python scripts/refine_english_site.py

      - name: Verify English build
        run: |
          test -f build/en/index.html
          test -f build/en/intro.html
          test -f build/en/people.html
          test -f build/en/research_DPnAI.html
          test -f build/en/data/digital_people.json
          test -f build/css/en.css
          grep -q 'JMC YSJ Program Chair' build/en/people.html
          grep -q 'Professional Programs' build/en/people.html
          grep -q 'Grounded in empathy, a future opened by creativity' build/en/index.html
          grep -q 'Moving the world through persuasion and messages' build/en/index.html
          grep -q 'Global Media Studio' build/en/index.html
          grep -q 'Virtual Reality Lab' build/en/index.html
          grep -q 'Research Centers' build/en/index.html
          grep -q '>Line 2<' build/en/index.html
          grep -q '>Gyeongui<' build/en/index.html
          ! grep -R -E 'href="(\.\./)?(notice|jobnotice|lend)\.html' build/en --include='*.html'
          ! grep -R -E 'href="(\.\./)?people_(emeritus|profpractice)\.html' build/en --include='*.html'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
