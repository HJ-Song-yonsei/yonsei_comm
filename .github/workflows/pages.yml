name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install i18n build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-i18n.txt

      - name: Validate DeepL secret
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          if [ -z "$DEEPL_API_KEY" ]; then
            echo "::error::DEEPL_API_KEY repository secret is not configured. See i18n/DEEPL_SETUP.md."
            exit 1
          fi

      - name: Restore DeepL translation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .i18n-cache
          key: deepl-en-${{ github.sha }}
          restore-keys: |
            deepl-en-

      - name: Assemble static site to build/
        run: |
          mkdir -p build
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.i18n-cache' \
            --exclude '.i18n-source' \
            --exclude 'build' \
            --exclude '.*' \
            ./ build/
          touch build/.nojekyll

      - name: Prepare Korean site and EN toggle
        run: python scripts/prepare_korean_site.py

      - name: Prepare protected English translation source
        run: python scripts/prepare_translation_source.py

      - name: Build core English static site with DeepL
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          python scripts/build_english_site.py \
            --source .i18n-source \
            --output build/en \
            --cache .i18n-cache/en.json

      - name: Build additional English pages
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          python scripts/build_additional_english_pages.py \
            --source .i18n-source \
            --output build/en \
            --cache .i18n-cache/en.json

      - name: Apply English terminology and navigation overrides
        run: python scripts/postprocess_english_site.py

      - name: Refine English homepage and navigation
        run: python scripts/refine_english_site.py

      - name: Verify production bilingual build
        run: python scripts/verify_i18n_build.py

      - name: Check Pages artifact dotfiles
        run: |
          test -f build/.nojekyll
          if find build -name '.*' ! -name '.nojekyll' -print -quit | grep -q .; then
            echo "::error::Unexpected hidden file in Pages artifact"
            exit 1
          fi

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build
          include-hidden-files: 'true'  # Preserve .nojekyll; other dotfiles are excluded/checked

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
